<div style="background:#F7F4F2;padding:32px 16px;font-family:Urbanist,'Helvetica Neue',Arial,sans-serif;color:#4F3422">
  <div style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:24px;padding:28px">
    <div style="font-size:36px;font-weight:900;letter-spacing:-1px;color:#4F3422">254</div>
    <h1 style="font-size:22px;margin:20px 0 8px">Reset your password</h1>
    <p style="font-size:15px;line-height:1.5;color:#736B66;margin:0 0 24px">
      Tap the button on your phone to set a new password in the 254 app. This link expires in 30 minutes.
    </p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4F3422;color:#ffffff;text-decoration:none;font-weight:700;font-size:15px;padding:14px 24px;border-radius:999px">Set a new password</a>
    <p style="font-size:12px;line-height:1.5;color:#ACA39D;margin:24px 0 0">
      Didn't ask for this? You can ignore this email — your password won't change.
    </p>
  </div>
</div>
